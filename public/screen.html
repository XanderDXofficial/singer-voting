<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十佳歌手大赛 · 实时大屏榜单</title>
  <style>
    :root {
      --indigo-deep: #15143B;
      --periwinkle: #6B75CE;
      --starlight: #FFF08A;
      --coral: #F48FB1;
      --mint: #6EE7D2;
      --cream: #FDFBF2;
      --glass-border: rgba(176, 188, 255, 0.22);
      --glass-highlight: rgba(255, 255, 255, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--indigo-deep);
      color: var(--cream);
      min-height: 100vh;
      padding: 18px 34px 18px;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      body {
        height: 100vh;
        overflow: hidden;
      }
    }

    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(19, 19, 54, 0.46) 0%, rgba(16, 17, 48, 0.62) 100%),
        url('/assets/stage-bg.png') center / cover no-repeat;
    }

    .stage-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, #000 35%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, #000 35%, transparent 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.42;
      animation: drift 16s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(107, 117, 206, 0.55), transparent 70%);
      top: -160px; left: -100px;
    }
    .orb-2 {
      width: 440px; height: 440px;
      background: radial-gradient(circle, rgba(255, 240, 138, 0.28), transparent 70%);
      bottom: -120px; right: -80px;
      animation-delay: -7s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(36px, 24px) scale(1.08); }
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1520px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 14px 24px;
      margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(46, 50, 126, 0.62), rgba(26, 27, 74, 0.72));
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 20px 50px rgba(8, 8, 28, 0.45),
        0 0 36px rgba(107, 117, 206, 0.22);
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .sdu-logo { height: 40px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 10px rgba(255,255,255,0.16)); flex-shrink: 0; }
    .divider { width: 1px; height: 32px; background: linear-gradient(180deg, transparent, rgba(255, 240, 138, 0.65), transparent); flex-shrink: 0; }
    .title-group { min-width: 0; }
    .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase; color: var(--starlight); margin-bottom: 3px; opacity: 0.95; }
    .top h1 {
      font-size: 24px; font-weight: 800; letter-spacing: 0.5px;
      background: linear-gradient(90deg, #FFFFFF 0%, #FDFBF2 60%, #FFF08A 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(176, 188, 255, 0.24);
      padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: #F5F6FF;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .pill.open {
      background: rgba(16, 185, 129, 0.22); color: #6EE7D2; border-color: rgba(110, 231, 210, 0.6);
      box-shadow: 0 0 22px rgba(110, 231, 210, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .pill.open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #6EE7D2; box-shadow: 0 0 10px #6EE7D2; animation: pulse 1.6s infinite; }
    .pill.paused { background: rgba(255, 240, 138, 0.16); color: #FFF08A; border-color: rgba(255, 240, 138, 0.5); }
    .pill.ended { background: rgba(244, 143, 177, 0.2); color: #FBCFE8; border-color: rgba(244, 143, 177, 0.5); }

    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.35); } }

    .stage-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .stage-fade-out {
      opacity: 0 !important;
      transform: translateY(-6px) !important;
    }

    .board { display: flex; flex-direction: column; justify-content: center; gap: 14px; flex: 1; min-height: 0; position: relative; }

    .board.two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
      align-content: stretch;
      height: 100%;
    }

    .row {
      display: grid;
      grid-template-columns: 74px 340px 1fr 230px;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, rgba(35, 38, 96, 0.66), rgba(22, 23, 66, 0.72));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      padding: 14px 22px;
      min-height: 76px;
      border-radius: 16px;
      border: 1px solid rgba(176, 188, 255, 0.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(8, 8, 28, 0.34);
      will-change: transform;
    }

    .board.two-col .row {
      grid-template-columns: 58px minmax(0, 1.35fr) minmax(70px, 0.9fr) 164px;
      gap: 14px;
      padding: 12px 18px;
      min-height: 0;
      height: 100%;
    }

    .board.two-col .rank {
      width: 52px; height: 38px; font-size: 14.5px;
    }
    .board.two-col .row.rank-1 .rank { font-size: 16px; }
    .board.two-col .info .name { font-size: 17px; }
    .board.two-col .song-inline { font-size: 13.5px; }
    .board.two-col .total { font-size: 22px; }
    .board.two-col .detail { font-size: 12px; }
    .board.two-col .bar-wrap { height: 20px; }

    .row.rank-1 {
      background: linear-gradient(135deg, rgba(255, 240, 138, 0.2), rgba(107, 117, 206, 0.36));
      border-color: rgba(255, 240, 138, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 250, 210, 0.35), 0 10px 32px rgba(20, 20, 68, 0.45), 0 0 28px rgba(255, 240, 138, 0.22);
    }
    .row.rank-2 {
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.16), rgba(65, 72, 152, 0.4));
      border-color: rgba(226, 232, 240, 0.38);
    }
    .row.rank-3 {
      background: linear-gradient(135deg, rgba(255, 186, 134, 0.18), rgba(65, 72, 152, 0.38));
      border-color: rgba(255, 186, 134, 0.42);
    }

    .rank {
      width: 60px; height: 40px; margin: 0 auto; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
      color: rgba(245, 246, 255, 0.85);
      background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(176, 188, 255, 0.22);
    }
    .row.rank-1 .rank { background: linear-gradient(135deg, #FFF6B8, #F59E0B); color: #1F1B3A; border-color: rgba(255,255,255,0.7); box-shadow: 0 0 20px rgba(255, 240, 138, 0.55); font-size: 17px; }
    .row.rank-2 .rank { background: linear-gradient(135deg, #F8FAFC, #94A3B8); color: #0F172A; border-color: rgba(255,255,255,0.6); font-size: 16px; }
    .row.rank-3 .rank { background: linear-gradient(135deg, #FFEDD5, #FB923C); color: #271206; border-color: rgba(255,235,210,0.55); font-size: 16px; }

    .info .name { font-size: 18px; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-inline { font-size: 14px; font-weight: 500; color: rgba(255, 240, 138, 0.92); margin-left: 4px; }
    .num-tag {
      display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--starlight);
      background: rgba(107, 117, 206, 0.45); border: 1px solid rgba(255, 240, 138, 0.32);
      padding: 2px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 1px;
    }

    .bar-wrap {
      height: 22px; background: rgba(12, 13, 38, 0.55); border: 1px solid rgba(176, 188, 255, 0.16);
      border-radius: 999px; overflow: hidden; padding: 3px; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
    }
    .bar {
      height: 100%; background: linear-gradient(90deg, #6B75CE 0%, #F48FB1 55%, #FFF08A 100%);
      border-radius: 999px; transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 16px rgba(244, 143, 177, 0.45);
    }
    .row.rank-1 .bar { background: linear-gradient(90deg, #F59E0B 0%, #FFF08A 70%, #FFFFFF 100%); box-shadow: 0 0 22px rgba(255, 240, 138, 0.65); }
    .row.rank-2 .bar { background: linear-gradient(90deg, #94A3B8 0%, #E2E8F0 70%, #FFFFFF 100%); box-shadow: 0 0 18px rgba(226, 232, 240, 0.45); }
    .row.rank-3 .bar { background: linear-gradient(90deg, #FB923C 0%, #FFBA86 65%, #FFEDD5 100%); box-shadow: 0 0 18px rgba(255, 186, 134, 0.45); }

    .score-box { text-align: right; font-variant-numeric: tabular-nums; }
    .total { font-size: 23px; font-weight: 800; color: #FFFFFF; }
    .row.rank-1 .total { color: #FFF08A; text-shadow: 0 0 20px rgba(255, 240, 138, 0.45); }
    .row.rank-2 .total { color: #F1F5F9; text-shadow: 0 0 16px rgba(226, 232, 240, 0.35); }
    .row.rank-3 .total { color: #FED7AA; text-shadow: 0 0 16px rgba(255, 186, 134, 0.35); }
    .detail { font-size: 12px; color: rgba(235, 238, 255, 0.78); margin-top: 2px; }

    /* 两页结果展示视图 */
    .section-banner {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding: 10px 18px; border-radius: 14px;
      background: rgba(54, 58, 136, 0.56); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 240, 138, 0.35);
      flex-shrink: 0;
    }
    .section-banner h2 { font-size: 18px; color: #FFF08A; }
    .section-banner span { font-size: 13.5px; color: #F4F5FF; }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 14px 18px;
      align-content: stretch;
      flex: 1;
      min-height: 0;
    }

    .groups-grid .row {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      gap: 8px;
      padding: 14px 20px;
      height: 100%;
    }
    .groups-grid .group-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .groups-grid .group-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .groups-grid .rank { width: 52px; height: 34px; margin: 0; font-size: 14px; flex-shrink: 0; }
    .groups-grid .total { font-size: 22px; flex-shrink: 0; }
    .groups-grid .group-members {
      font-size: 14.5px;
      font-weight: 600;
      color: rgba(253, 251, 242, 0.94);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .groups-grid .group-bottom {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .groups-grid .bar-wrap { flex: 1; height: 14px; }
    .groups-grid .detail { margin-top: 0; flex-shrink: 0; font-size: 12.5px; }

    .group-badge-win {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: linear-gradient(90deg, #FFF6B8, #F59E0B); color: #1F1B3A;
    }
    .group-badge-win.silver {
      background: linear-gradient(90deg, #F8FAFC, #CBD5E1); color: #0F172A;
    }
    .group-badge-duel {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,0.12); color: #E2E8F0;
    }

    .duel-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-content: stretch;
      flex: 1;
      min-height: 0;
    }
    .duel-card {
      background: linear-gradient(135deg, rgba(35, 38, 96, 0.66), rgba(22, 23, 66, 0.72));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(176, 188, 255, 0.22);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 10px 26px rgba(8, 8, 28, 0.35);
      will-change: transform;
      height: 100%;
    }
    .duel-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14.5px; font-weight: 700; color: var(--starlight);
      border-bottom: 1px solid rgba(176, 188, 255, 0.18); padding-bottom: 8px;
      flex-shrink: 0;
    }
    .duel-fighters { display: flex; flex-direction: column; justify-content: center; gap: 12px; flex: 1; }
    .duel-fighter {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 16px; border-radius: 14px; flex: 1;
      transition: opacity 0.3s ease, filter 0.3s ease, border-color 0.3s ease;
      will-change: transform;
    }
    .duel-fighter.winner {
      background: linear-gradient(135deg, rgba(107, 117, 206, 0.48), rgba(255, 240, 138, 0.22));
      border: 1.5px solid var(--starlight);
      box-shadow: 0 0 22px rgba(255, 240, 138, 0.26);
    }
    .duel-fighter.eliminated {
      background: rgba(12, 13, 38, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      opacity: 0.44;
      filter: grayscale(0.45);
    }
    .duel-tag-win {
      background: linear-gradient(135deg, #FFF6B8, #F59E0B); color: #1F1B3A;
      font-size: 11.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px;
    }
    .duel-tag-out {
      background: rgba(255,255,255,0.12); color: #cbd5e1;
      font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px;
    }

    .footer-brand {
      margin-top: 12px; padding-top: 10px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; letter-spacing: 1.4px; color: rgba(235, 238, 255, 0.58);
      border-top: 1px solid rgba(176, 188, 255, 0.14);
      flex-shrink: 0;
    }
    .tech-support { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: 0.6px; color: rgba(235, 238, 255, 0.54); }
    .tech-support img { height: 16px; width: auto; opacity: 0.85; vertical-align: middle; }

    /* 赛前待机舞台页 */
    #standbyStage {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .standby-panel {
      padding: 56px 72px;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(46, 50, 126, 0.58), rgba(24, 25, 72, 0.72));
      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);
      border: 1px solid rgba(176, 188, 255, 0.28);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 30px 70px rgba(8, 8, 28, 0.55),
        0 0 60px rgba(107, 117, 206, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .standby-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }

    .standby-lockup img {
      height: 68px;
      width: auto;
      filter: drop-shadow(0 4px 16px rgba(255, 255, 255, 0.2));
    }

    .standby-sep { font-size: 38px; font-weight: 200; color: rgba(255, 240, 138, 0.78); }
    .standby-college {
      font-size: 40px; font-weight: 800; letter-spacing: 6px;
      background: linear-gradient(90deg, #FFFFFF 0%, #FDFBF2 60%, #FFF08A 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .standby-sub { font-size: 15px; letter-spacing: 4px; color: rgba(255, 240, 138, 0.8); text-transform: uppercase; }

    /* 奥运赛果式自上而下优雅浮入动画 */
    @keyframes olympicEnter {
      0% { opacity: 0; transform: translateY(-14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .olympic-in {
      animation: olympicEnter 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
  </style>
</head>
<body>
  <div class="stage-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="stage-grid"></div>

  <div class="shell">
    <div id="topHeader" class="top">
      <div class="brand">
        <img class="sdu-logo" src="/assets/sdu-logo-light.png" alt="Shandong University" />
        <div class="divider"></div>
        <div class="title-group">
          <div class="eyebrow">SDU / SOFTWARE FINALS · 声赴热爱，音启星光</div>
          <h1 id="title">十佳歌手大赛 · 实时投票</h1>
        </div>
      </div>
      <div class="meta">
        <div class="pill" id="roundInfo">第 1 轮</div>
        <div class="pill" id="statsInfo">已投 0 票</div>
        <div class="pill" id="statusPill">连接中</div>
      </div>
    </div>

    <div id="standbyStage">
      <div class="standby-panel">
        <div class="standby-lockup">
          <img src="/assets/sdu-logo-light.png" alt="Shandong University" />
          <span class="standby-sep">｜</span>
          <span class="standby-college">软件学院</span>
        </div>
        <div class="standby-sub">声赴热爱，音启星光 · SDU / SOFTWARE FINALS</div>
      </div>
    </div>

    <div id="stageContent" class="stage-container"></div>

    <div class="footer-brand">
      <span>SHANDONG UNIVERSITY · SCHOOL OF SOFTWARE · 十佳歌手大赛实时计票系统</span>
      <span class="tech-support">技术支持：<img src="/assets/dx-logo.png" alt="D.X. Studio" /></span>
    </div>
  </div>

  <script>
    function formatOrdinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function formatNameSong(c) {
      const name = c.name || '待填写选手';
      const song = c.song ? `<span class="song-inline">《${c.song}》</span>` : '';
      return `${name}${song}`;
    }

    // 2D FLIP 平滑名次移动辅助函数
    function captureRects(domMap) {
      const rects = new Map();
      domMap.forEach((el, key) => {
        rects.set(key, el.getBoundingClientRect());
      });
      return rects;
    }

    function runFlip(domMap, firstRects) {
      domMap.forEach((el, key) => {
        const first = firstRects.get(key);
        if (!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.style.transition = 'none';
          el.style.transform = `translate(${dx}px, ${dy}px)`;
          el.getBoundingClientRect();
          el.style.transition = 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
          el.style.transform = 'translate(0, 0)';
        }
      });
    }

    function applyOlympicEntrance(container) {
      const items = container.querySelectorAll('.section-banner, .row, .duel-card, .standby-panel');
      items.forEach((el, idx) => {
        el.classList.remove('olympic-in');
        el.style.animationDelay = '';
        void el.offsetWidth;
        el.style.animationDelay = `${idx * 42}ms`;
        el.classList.add('olympic-in');
        el.addEventListener('animationend', () => {
          el.classList.remove('olympic-in');
          el.style.animationDelay = '';
        }, { once: true });
      });
    }

    let currentViewMode = '';
    const liveRowMap = new Map();
    const groupRowMap = new Map();
    const duelCardMap = new Map(); // group -> { cardEl, fighterMap }

    function clearViewMaps() {
      liveRowMap.clear();
      groupRowMap.clear();
      duelCardMap.clear();
    }

    function renderLiveBoard(container, data) {
      const { settings, leaderboard } = data;
      const isTop10 = settings.mode === 'top10';
      const roundNum = Number(settings.currentRound);
      const sorted = [...leaderboard].sort((a, b) => b.totalScore - a.totalScore);
      const maxScore = Math.max(...sorted.map(c => c.totalScore), 1);

      let boardEl = container.querySelector('.board');
      if (currentViewMode !== 'live' || !boardEl) {
        clearViewMaps();
        container.innerHTML = '<div class="board"></div>';
        boardEl = container.querySelector('.board');
        currentViewMode = 'live';
      }

      boardEl.className = `board ${sorted.length > 6 ? 'two-col' : ''}`;
      boardEl.style.gridTemplateRows = sorted.length > 6
        ? `repeat(${Math.ceil(sorted.length / 2)}, minmax(0, 1fr))`
        : '';

      const firstRects = captureRects(liveRowMap);
      const validIds = new Set(sorted.map(c => c.id));
      for (const [id, el] of liveRowMap.entries()) {
        if (!validIds.has(id)) {
          el.remove();
          liveRowMap.delete(id);
        }
      }

      sorted.forEach((c, idx) => {
        const rankNum = idx + 1;
        let row = liveRowMap.get(c.id);
        if (!row) {
          row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `
            <div class="rank"></div>
            <div class="info"><div class="name"></div></div>
            <div class="bar-wrap"><div class="bar"></div></div>
            <div class="score-box"><div class="total"></div><div class="detail"></div></div>
          `;
          liveRowMap.set(c.id, row);
        }

        row.className = `row ${rankNum <= 3 ? 'rank-' + rankNum : ''}`;
        row.querySelector('.rank').textContent = formatOrdinal(rankNum);

        const groupBadge = isTop10 && roundNum === 1 && c.group ? `<span class="num-tag">第${c.group}组</span>` : '';
        row.querySelector('.info .name').innerHTML = `<span class="num-tag">${c.number}号</span>${groupBadge}${formatNameSong(c)}`;

        const pct = c.totalScore === 0 ? 0 : Math.max(4, Math.round((c.totalScore / maxScore) * 100));
        row.querySelector('.bar').style.width = `${pct}%`;
        row.querySelector('.total').textContent = `${c.totalScore} 分`;

        const groupDetail = isTop10 && roundNum === 1 && c.groupTotal !== undefined ? ` · 组票 ${c.groupTotal}` : '';
        row.querySelector('.detail').textContent = `观众 ${c.audienceVotes} 票 · 导师 ${c.judgeVotes} 票${groupDetail}`;

        boardEl.appendChild(row);
      });

      runFlip(liveRowMap, firstRects);
    }

    function buildR1Groups(board) {
      const groups = {};
      board.forEach(c => {
        const g = c.group || 1;
        if (!groups[g]) groups[g] = [];
        groups[g].push(c);
      });
      return Object.entries(groups).map(([g, members]) => ({
        group: Number(g),
        members: [...members].sort((a, b) => b.totalScore - a.totalScore),
        total: members.reduce((s, m) => s + m.totalScore, 0)
      })).sort((a, b) => b.total - a.total);
    }

    function renderR1GroupsView(container, data) {
      const board = data.allRound1Leaderboard || data.leaderboard || [];
      const groupList = buildR1Groups(board);
      const maxTotal = Math.max(...groupList.map(g => g.total), 1);

      let gridEl = container.querySelector('.groups-grid');
      if (currentViewMode !== 'r1-groups' || !gridEl) {
        clearViewMaps();
        container.innerHTML = `
          <div class="section-banner">
            <h2>🏆 第 1 轮 · 八组双人组合总票数榜（第一页）</h2>
            <span>组合前 2 名（共 4 位选手）直接晋级十强</span>
          </div>
          <div class="groups-grid"></div>
        `;
        gridEl = container.querySelector('.groups-grid');
        currentViewMode = 'r1-groups';
      }

      const firstRects = captureRects(groupRowMap);

      groupList.forEach((g, idx) => {
        const rankNum = idx + 1;
        const isFirst = idx === 0;
        const isSecond = idx === 1;
        const isTop2 = idx < 2;
        const pct = g.total === 0 ? 0 : Math.max(4, Math.round((g.total / maxTotal) * 100));
        const names = g.members.map(m => `${m.number}号 ${m.name || '待定'}${m.song ? `《${m.song}》` : ''}`).join('  &  ');

        let row = groupRowMap.get(g.group);
        if (!row) {
          row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `
            <div class="group-top">
              <div class="group-top-left">
                <div class="rank"></div>
                <div class="name"></div>
              </div>
              <div class="total"></div>
            </div>
            <div class="group-members"></div>
            <div class="group-bottom">
              <div class="bar-wrap"><div class="bar"></div></div>
              <div class="detail"></div>
            </div>
          `;
          groupRowMap.set(g.group, row);
        }

        row.className = `row ${isFirst ? 'rank-1' : (isSecond ? 'rank-2' : '')}`;
        row.style.opacity = isTop2 ? '1' : '0.9';
        row.querySelector('.rank').textContent = formatOrdinal(rankNum);
        row.querySelector('.name').innerHTML = `
          <span class="num-tag">第 ${g.group} 组</span>
          ${isFirst ? '<span class="group-badge-win">✅ 直通晋级</span>' : (isSecond ? '<span class="group-badge-win silver">✅ 直通晋级</span>' : '<span class="group-badge-duel">组内二选一</span>')}
        `;
        row.querySelector('.group-members').textContent = names;
        row.querySelector('.bar').style.width = `${pct}%`;
        row.querySelector('.total').textContent = `${g.total} 分`;
        row.querySelector('.detail').textContent = g.members.map(m => `${m.number}号:${m.totalScore}`).join(' + ');

        gridEl.appendChild(row);
      });

      runFlip(groupRowMap, firstRects);
    }

    function renderR1DuelsView(container, data) {
      const board = data.allRound1Leaderboard || data.leaderboard || [];
      const groupList = buildR1Groups(board);
      const remaining6 = groupList.slice(2);

      let gridEl = container.querySelector('.duel-grid');
      if (currentViewMode !== 'r1-duels' || !gridEl) {
        clearViewMaps();
        container.innerHTML = `
          <div class="section-banner">
            <h2>⚔️ 第 1 轮 · 其余六组组内二选一结果（第二页）</h2>
            <span>每组个人分更高者晋级十强（共 6 位晋级）</span>
          </div>
          <div class="duel-grid"></div>
        `;
        gridEl = container.querySelector('.duel-grid');
        currentViewMode = 'r1-duels';
      }

      const firstCardRects = new Map();
      duelCardMap.forEach((entry, gId) => {
        firstCardRects.set(gId, entry.cardEl.getBoundingClientRect());
      });

      const validGroups = new Set(remaining6.map(g => g.group));
      for (const [gId, entry] of duelCardMap.entries()) {
        if (!validGroups.has(gId)) {
          entry.cardEl.remove();
          duelCardMap.delete(gId);
        }
      }

      remaining6.forEach(g => {
        let entry = duelCardMap.get(g.group);
        if (!entry) {
          const cardEl = document.createElement('div');
          cardEl.className = 'duel-card';
          cardEl.innerHTML = `
            <div class="duel-header"><span class="dh-left"></span><span class="dh-right"></span></div>
            <div class="duel-fighters"></div>
          `;
          entry = { cardEl, fighterMap: new Map() };
          duelCardMap.set(g.group, entry);
        }

        entry.cardEl.querySelector('.dh-left').textContent = `第 ${g.group} 组 · 组内二选一`;
        entry.cardEl.querySelector('.dh-right').textContent = `组票 ${g.total} 分`;

        const fightersEl = entry.cardEl.querySelector('.duel-fighters');
        const firstFighterRects = captureRects(entry.fighterMap);

        g.members.forEach((m, i) => {
          const isWin = i === 0;
          let fEl = entry.fighterMap.get(m.id);
          if (!fEl) {
            fEl = document.createElement('div');
            fEl.className = 'duel-fighter';
            fEl.innerHTML = `
              <div style="min-width:0; padding-right:8px;">
                <div class="df-name" style="font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
                <div class="df-sub" style="font-size:11.5px; color:rgba(255,240,236,0.72); margin-top:3px;"></div>
              </div>
              <div style="text-align:right; flex-shrink:0;">
                <div class="df-score" style="font-size:19px; font-weight:800;"></div>
                <div class="df-tag" style="margin-top:3px;"></div>
              </div>
            `;
            entry.fighterMap.set(m.id, fEl);
          }

          fEl.className = `duel-fighter ${isWin ? 'winner' : 'eliminated'}`;
          fEl.querySelector('.df-name').innerHTML = `<span class="num-tag">${m.number}号</span>${formatNameSong(m)}`;
          fEl.querySelector('.df-sub').textContent = `观众 ${m.audienceVotes} 票 · 导师 ${m.judgeVotes} 票`;
          const scoreEl = fEl.querySelector('.df-score');
          scoreEl.textContent = `${m.totalScore} 分`;
          scoreEl.style.color = isWin ? '#FDE68A' : '#cbd5e1';
          fEl.querySelector('.df-tag').innerHTML = isWin ? '<span class="duel-tag-win">✅ 晋级</span>' : '<span class="duel-tag-out">未晋级</span>';

          fightersEl.appendChild(fEl);
        });

        gridEl.appendChild(entry.cardEl);
        runFlip(entry.fighterMap, firstFighterRects);
      });

      // 对 6 张卡片本身也执行 2D FLIP
      duelCardMap.forEach((entry, gId) => {
        const first = firstCardRects.get(gId);
        if (!first) return;
        const last = entry.cardEl.getBoundingClientRect();
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          entry.cardEl.style.transition = 'none';
          entry.cardEl.style.transform = `translate(${dx}px, ${dy}px)`;
          entry.cardEl.getBoundingClientRect();
          entry.cardEl.style.transition = 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
          entry.cardEl.style.transform = 'translate(0, 0)';
        }
      });
    }

    let lastViewSignature = '';
    let pendingTransitionTimer = null;
    let latestStateData = null;

    function applyRender(data, triggerEntrance) {
      const { settings, stats } = data;
      const topHeaderEl = document.getElementById('topHeader');
      const standbyStageEl = document.getElementById('standbyStage');
      const container = document.getElementById('stageContent');

      const isTop10 = settings.mode === 'top10';
      const roundNum = Number(settings.currentRound);
      const activeGroup = Number(settings.activeGroup) || 0;
      const isStandby = Boolean(settings.standbyMode);
      const view = isTop10 && roundNum === 1 ? (settings.screenView || 'live') : 'live';

      if (isStandby) {
        topHeaderEl.style.display = 'none';
        container.style.display = 'none';
        standbyStageEl.style.display = 'flex';
        standbyStageEl.classList.remove('stage-fade-out');
        if (triggerEntrance) applyOlympicEntrance(standbyStageEl);
        return;
      }

      topHeaderEl.style.display = 'flex';
      container.style.display = 'flex';
      standbyStageEl.style.display = 'none';
      container.classList.remove('stage-fade-out');

      document.getElementById('title').textContent = settings.title;

      let roundLabel = `第 ${roundNum} 轮`;
      if (isTop10) {
        if (roundNum === 1) {
          roundLabel = activeGroup > 0 ? `第 1 轮 · 第 ${activeGroup} 组双人舞台` : '第 1 轮 · 16 进 10';
        } else if (roundNum === 2) roundLabel = '第 2 轮 · 10 进 5';
        else if (roundNum === 3) roundLabel = '第 3 轮 · 5 进 3 巅峰对决';
      }
      document.getElementById('roundInfo').textContent = `${roundLabel} · 导师权重 ×${settings.judgeWeight}`;
      document.getElementById('statsInfo').textContent = `观众 ${stats.totalAudienceVotes} 票 · 导师 ${stats.totalJudgeVotes}/${stats.totalJudges} 票`;

      const statusPill = document.getElementById('statusPill');
      const map = { open: '投票进行中', paused: '投票已暂停', ended: '投票已结束' };
      statusPill.textContent = map[settings.votingStatus] || settings.votingStatus;
      statusPill.className = `pill ${settings.votingStatus}`;

      if (view === 'r1-groups') renderR1GroupsView(container, data);
      else if (view === 'r1-duels') renderR1DuelsView(container, data);
      else renderLiveBoard(container, data);

      if (triggerEntrance) {
        applyOlympicEntrance(container);
      }
    }

    function render(data) {
      latestStateData = data;
      const { settings } = data;
      const isTop10 = settings.mode === 'top10';
      const roundNum = Number(settings.currentRound);
      const activeGroup = Number(settings.activeGroup) || 0;
      const isStandby = Boolean(settings.standbyMode);
      const view = isTop10 && roundNum === 1 ? (settings.screenView || 'live') : 'live';
      const nextSignature = `${isStandby}|${view}|${roundNum}|${activeGroup}`;

      if (!lastViewSignature) {
        lastViewSignature = nextSignature;
        applyRender(data, true);
        return;
      }

      if (nextSignature !== lastViewSignature) {
        lastViewSignature = nextSignature;
        if (pendingTransitionTimer) clearTimeout(pendingTransitionTimer);
        const standbyStageEl = document.getElementById('standbyStage');
        const container = document.getElementById('stageContent');
        const visibleEl = standbyStageEl.style.display === 'flex' ? standbyStageEl : container;
        visibleEl.classList.add('stage-fade-out');
        pendingTransitionTimer = setTimeout(() => {
          pendingTransitionTimer = null;
          applyRender(latestStateData, true);
        }, 220);
        return;
      }

      if (!pendingTransitionTimer) {
        applyRender(data, false);
      }
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'STATE_UPDATE') render(msg.data);
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    connectWS();
  </script>
</body>
