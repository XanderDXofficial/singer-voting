<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>导师专属投票通道</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px 16px 90px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; color: #fbbf24; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fde68a;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 13px;
    }
    .box {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 16px;
    }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: rgba(255,255,255,0.08);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .card.selected {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
    }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .num {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .card.selected .num { background: #f59e0b; color: #000; }
    .name { font-size: 16px; font-weight: 600; }
    .song { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      color: #000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { background: #475569; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">导师专属投票通道</h1>
    <div class="badge" id="weightBadge">加载中...</div>
  </div>

  <div class="box">
    <label>请输入导师专属口令（默认 J1 / J2 / J3，可在后台修改）</label>
    <input id="judgeCode" type="text" placeholder="例如：J1" />
  </div>

  <div id="list" class="list"></div>

  <div class="footer">
    <button id="submitBtn" class="btn">提交导师加权票</button>
  </div>

  <script>
    const urlCode = new URLSearchParams(location.search).get('code');
    if (urlCode) {
      document.getElementById('judgeCode').value = urlCode.trim().toUpperCase();
    }

    let appState = null;
    const selectedIds = new Set();

    function render() {
      if (!appState) return;
      const { settings, leaderboard } = appState;
      document.getElementById('title').textContent = `${settings.title} · 导师席`;
      const statusText = settings.votingStatus === 'open' ? '🟢 通道已开启' : (settings.votingStatus === 'paused' ? '🟡 已暂停' : '🔴 已结束');
      document.getElementById('weightBadge').textContent = `第 ${settings.currentRound} 轮 · ${statusText} · 导师 1 票 = ${settings.judgeWeight} 观众票`;

      document.getElementById('list').innerHTML = leaderboard.map(c => `
        <div class="card ${selectedIds.has(c.id) ? 'selected' : ''}" onclick="toggle(${c.id})">
          <div class="card-left">
            <div class="num">${c.number}</div>
            <div>
              <div class="name">${c.name}</div>
              <div class="song">${c.song || ''}</div>
            </div>
          </div>
          <div>${selectedIds.has(c.id) ? '★ 已选' : '选择'}</div>
        </div>
      `).join('');
    }

    async function init() {
      const res = await fetch('/api/state');
      appState = await res.json();
      render();
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'STATE_UPDATE') {
          appState = msg.data;
          render();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    window.toggle = function(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      render();
    };

    document.getElementById('submitBtn').onclick = async () => {
      const judgeCode = document.getElementById('judgeCode').value.trim();
      if (!judgeCode) return alert('请输入导师口令');
      if (selectedIds.size === 0) return alert('请至少选择一位选手');

      const res = await fetch('/api/judge/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ judgeCode, contestantIds: Array.from(selectedIds) })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error || '投票失败');
      alert('导师加权投票成功！大屏幕已实时更新。');
    };

    init();
    connectWS();
  </script>
</body>
</html>
