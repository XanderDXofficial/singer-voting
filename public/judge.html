<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>导师专属投票通道</title>
  <style>
    :root {
      --sdu-crimson: #9B0D14;
      --sdu-gold: #E6C27A;
      --bg-obsidian: #0B0507;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-obsidian);
      color: #FFF8F6;
      min-height: 100vh;
      padding: 20px 16px 104px;
      position: relative;
      overflow-x: hidden;
    }

    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 50% at 50% -5%, rgba(155, 13, 20, 0.45) 0%, transparent 70%),
        radial-gradient(circle at 85% 20%, rgba(230, 194, 122, 0.22) 0%, transparent 48%),
        radial-gradient(circle at 15% 82%, rgba(200, 22, 29, 0.2) 0%, transparent 50%),
        linear-gradient(180deg, #16060A 0%, #090406 100%);
    }

    .stage-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, #000 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, #000 30%, transparent 100%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      padding: 18px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(230, 194, 122, 0.12), rgba(155, 13, 20, 0.18));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(230, 194, 122, 0.3);
      box-shadow:
        inset 0 1px 0 rgba(255, 240, 200, 0.24),
        0 14px 36px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: var(--sdu-gold);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #FFF7E0 0%, #E6C27A 60%, #FDE68A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-block;
      background: rgba(230, 194, 122, 0.14);
      border: 1px solid rgba(230, 194, 122, 0.42);
      color: #FDE68A;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(230, 194, 122, 0.15);
    }

    .box {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.03));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(243, 228, 225, 0.85);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(230, 194, 122, 0.35);
      background: rgba(0, 0, 0, 0.38);
      color: #FFF8EB;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--sdu-gold);
      box-shadow: 0 0 0 3px rgba(230, 194, 122, 0.2);
    }

    .list { display: flex; flex-direction: column; gap: 11px; }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .card:active { transform: scale(0.985); }

    .card.selected {
      background: linear-gradient(135deg, rgba(230, 194, 122, 0.22), rgba(155, 13, 20, 0.28));
      border-color: var(--sdu-gold);
      box-shadow:
        inset 0 1px 0 rgba(255, 240, 200, 0.38),
        0 0 24px rgba(230, 194, 122, 0.28);
    }

    .card-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .num {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px;
      color: #FCE7E4;
      flex-shrink: 0;
      transition: all 0.22s ease;
    }

    .card.selected .num {
      background: linear-gradient(135deg, #FCE3A6 0%, #D4A145 100%);
      border-color: #FFF5D6;
      color: #2A0A0D;
      box-shadow: 0 0 16px rgba(230, 194, 122, 0.55);
    }

    .name { font-size: 16px; font-weight: 700; color: #FFFFFF; }

    .status-tag {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 240, 236, 0.55);
      flex-shrink: 0;
    }

    .card.selected .status-tag {
      color: #FDE68A;
      text-shadow: 0 0 12px rgba(230, 194, 122, 0.5);
    }

    /* 赛前待机页面 */
    #standbyView {
      display: none;
      min-height: calc(100vh - 140px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .standby-card {
      padding: 36px 26px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(155, 13, 20, 0.16));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 20px 50px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .standby-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .standby-lockup img {
      height: 34px;
      width: auto;
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.14));
    }

    .standby-sep { font-size: 20px; font-weight: 300; color: rgba(230, 194, 122, 0.7); }
    .standby-college { font-size: 21px; font-weight: 700; letter-spacing: 3px; color: #FFF6F4; }
    .standby-sub { font-size: 13px; color: rgba(243, 228, 225, 0.65); letter-spacing: 1px; }

    .page-footer {
      margin-top: 28px;
      padding: 18px 12px 10px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .page-footer img {
      height: 30px;
      width: auto;
      opacity: 0.88;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    .page-footer span {
      font-size: 11.5px;
      letter-spacing: 1.5px;
      color: rgba(255, 240, 236, 0.5);
    }

    .tech-support {
      font-size: 11px;
      color: rgba(255, 240, 236, 0.38);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .tech-support img { height: 15px; width: auto; opacity: 0.78; }

    /* 5 秒纯 CSS 黑底开屏动画 */
    #introSplash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease;
    }

    #introSplash.hide { opacity: 0; pointer-events: none; }

    .splash-stage {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-text {
      position: absolute;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.92);
      opacity: 0;
      animation: splashTextSeq 2.2s ease both;
    }

    .splash-logo {
      position: absolute;
      width: 210px;
      max-width: 62vw;
      height: auto;
      opacity: 0;
      animation: splashLogoSeq 2.7s ease 2.25s both;
    }

    @keyframes splashTextSeq {
      0% { opacity: 0; transform: translateY(10px); }
      32% { opacity: 1; transform: translateY(0); }
      72% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes splashLogoSeq {
      0% { opacity: 0; transform: scale(0.92); }
      30% { opacity: 1; transform: scale(1); }
      74% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.03); }
    }

    .skip-btn {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      z-index: 10000;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    #popupModal {
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: rgba(6, 2, 4, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #popupModal.show { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(135deg, rgba(38, 12, 18, 0.92), rgba(18, 6, 9, 0.95));
      border: 1px solid rgba(230, 194, 122, 0.38);
      border-radius: 22px;
      padding: 26px 22px 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
      animation: modalPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.93) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-body { font-size: 15.5px; line-height: 1.65; color: #FFF4F2; white-space: pre-line; margin-bottom: 22px; }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 240, 200, 0.5);
      background: linear-gradient(90deg, #B88428 0%, #E6C27A 55%, #D99B38 100%);
      color: #24090B;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: rgba(14, 6, 8, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(230, 194, 122, 0.2);
    }

    .btn {
      max-width: 560px;
      margin: 0 auto;
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 240, 200, 0.5);
      border-radius: 14px;
      background: linear-gradient(90deg, #B88428 0%, #E6C27A 55%, #D99B38 100%);
      color: #24090B;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 8px 26px rgba(230, 194, 122, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 240, 236, 0.4);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="introSplash">
    <div class="splash-stage">
      <div class="splash-text">Designed by</div>
      <img class="splash-logo" src="/assets/dx-mark.png" alt="D.X." />
    </div>
    <button id="skipSplashBtn" class="skip-btn" type="button">跳过</button>
  </div>

  <div id="popupModal">
    <div class="modal-card">
      <div id="popupBody" class="modal-body"></div>
      <button id="popupConfirmBtn" class="modal-btn" type="button">好</button>
    </div>
  </div>

  <div class="stage-bg"></div>
  <div class="stage-grid"></div>

  <div class="container">
    <div id="standbyView">
      <div class="standby-card">
        <div class="standby-lockup">
          <img src="/assets/sdu-logo-light.png" alt="Shandong University" />
          <span class="standby-sep">｜</span>
          <span class="standby-college">软件学院</span>
        </div>
        <div class="standby-sub">比赛即将开始 · 敬请期待</div>
      </div>
    </div>

    <div id="votingView">
      <div class="header">
        <div class="eyebrow">SCHOOL OF SOFTWARE · VIP JURY</div>
        <h1 id="title">导师专属投票通道</h1>
        <div class="badge" id="weightBadge">加载中...</div>
      </div>

      <div class="box">
        <label>导师专属口令（默认 J1 / J2 / J3，扫码自动填入）</label>
        <input id="judgeCode" type="text" placeholder="例如：J1" />
      </div>

      <div id="list" class="list"></div>
    </div>

    <div class="page-footer">
      <img src="/assets/sdu-logo-light.png" alt="Shandong University" />
      <span>山东大学软件学院 · 导师席</span>
      <div class="tech-support">
        <span>技术支持：</span>
        <img src="/assets/dx-logo.png" alt="D.X. Studio" />
      </div>
    </div>
  </div>

  <div id="bottomDock" class="footer">
    <button id="submitBtn" class="btn">提交导师加权票</button>
  </div>

  <script>
    const urlCode = new URLSearchParams(location.search).get('code');
    if (urlCode) {
      document.getElementById('judgeCode').value = urlCode.trim().toUpperCase();
    }

    let appState = null;
    const selectedIds = new Set();
    let splashFinished = false;
    let welcomeChecked = false;

    const standbyViewEl = document.getElementById('standbyView');
    const votingViewEl = document.getElementById('votingView');
    const bottomDockEl = document.getElementById('bottomDock');
    const popupModalEl = document.getElementById('popupModal');
    const popupBodyEl = document.getElementById('popupBody');

    function openPopup(text, onConfirm) {
      if (!text) return;
      popupBodyEl.textContent = text;
      popupModalEl.classList.add('show');
      document.getElementById('popupConfirmBtn').onclick = () => {
        popupModalEl.classList.remove('show');
        if (onConfirm) onConfirm();
      };
    }

    function maybeShowWelcomePopup() {
      if (!splashFinished || welcomeChecked || !appState) return;
      welcomeChecked = true;
      const msg = (appState.settings.welcomePopupText || '').trim();
      if (msg && !localStorage.getItem('dx_welcome_seen')) {
        openPopup(msg, () => localStorage.setItem('dx_welcome_seen', '1'));
      }
    }

    function render() {
      if (!appState) return;
      const { settings, leaderboard } = appState;

      if (settings.standbyMode) {
        standbyViewEl.style.display = 'flex';
        votingViewEl.style.display = 'none';
        bottomDockEl.style.display = 'none';
        return;
      }

      standbyViewEl.style.display = 'none';
      votingViewEl.style.display = 'block';
      bottomDockEl.style.display = 'block';

      document.getElementById('title').textContent = `${settings.title} · 导师席`;
      const statusText = settings.votingStatus === 'open' ? '🟢 通道已开启' : (settings.votingStatus === 'paused' ? '🟡 已暂停' : '🔴 已结束');
      const groupPrefix = settings.mode === 'top10' && Number(settings.currentRound) === 1 && Number(settings.activeGroup) > 0
        ? `第 ${settings.activeGroup} 组双人舞台 · `
        : '';
      document.getElementById('weightBadge').textContent = `第 ${settings.currentRound} 轮 · ${groupPrefix}${statusText} · 导师 1 票 = ${settings.judgeWeight} 观众票`;

      document.getElementById('list').innerHTML = leaderboard.map(c => {
        const songHtml = c.song ? ` <span style="color:#E6C27A; font-weight:500; font-size:14px;">《${c.song}》</span>` : '';
        return `
          <div class="card ${selectedIds.has(c.id) ? 'selected' : ''}" onclick="toggle(${c.id})">
            <div class="card-left">
              <div class="num">${c.number}</div>
              <div>
                <div class="name">${c.name || '待填写选手'}${songHtml}</div>
              </div>
            </div>
            <div class="status-tag">${selectedIds.has(c.id) ? '★ 已选' : '选择'}</div>
          </div>
        `;
      }).join('');
    }

    async function init() {
      const res = await fetch('/api/state');
      appState = await res.json();
      render();
      maybeShowWelcomePopup();
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'POPUP_BROADCAST' && msg.data?.message) {
          openPopup(msg.data.message);
          return;
        }
        if (msg.type === 'STATE_UPDATE') {
          appState = msg.data;
          render();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    window.toggle = function(id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      render();
    };

    document.getElementById('submitBtn').onclick = async () => {
      const judgeCode = document.getElementById('judgeCode').value.trim();
      if (!judgeCode) return alert('请输入导师口令');
      if (selectedIds.size === 0) return alert('请至少选择一位选手');

      const res = await fetch('/api/judge/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ judgeCode, contestantIds: Array.from(selectedIds) })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error || '投票失败');
      alert('导师加权投票成功！大屏幕已实时更新。');
    };

    (function setupSplash() {
      const splash = document.getElementById('introSplash');
      const skipBtn = document.getElementById('skipSplashBtn');
      if (!splash) {
        splashFinished = true;
        return;
      }

      let dismissed = false;
      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        splash.classList.add('hide');
        setTimeout(() => {
          splash.remove();
          splashFinished = true;
          maybeShowWelcomePopup();
        }, 460);
      }

      skipBtn.addEventListener('click', dismissSplash);
      setTimeout(dismissSplash, 5000);
    })();

    init();
    connectWS();
  </script>
</body>
</html>
