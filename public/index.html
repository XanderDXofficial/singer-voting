<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>十佳歌手大赛 · 观众投票</title>
  <style>
    :root {
      --sdu-crimson: #9B0D14;
      --sdu-rose: #E11D48;
      --sdu-gold: #E6C27A;
      --bg-obsidian: #0B0507;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-obsidian);
      color: #FFF8F6;
      min-height: 100vh;
      padding: 20px 16px 104px;
      position: relative;
      overflow-x: hidden;
    }

    .stage-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 95% 50% at 50% -5%, rgba(155, 13, 20, 0.5) 0%, transparent 70%),
        radial-gradient(circle at 90% 80%, rgba(230, 194, 122, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 10% 70%, rgba(225, 29, 72, 0.18) 0%, transparent 50%),
        linear-gradient(180deg, #16060A 0%, #090406 100%);
    }

    .stage-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, #000 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, #000 30%, transparent 100%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
      padding: 18px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(155, 13, 20, 0.16));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 14px 36px rgba(0, 0, 0, 0.4);
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: var(--sdu-gold);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #FFFFFF 0%, #FFE4DF 70%, #E6C27A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: #F4E6E4;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .status-banner {
      background: rgba(245, 158, 11, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(245, 158, 11, 0.55);
      color: #FDE68A;
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .status-banner.open {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.14));
      border-color: rgba(52, 211, 153, 0.7);
      color: #6EE7B7;
      box-shadow: 0 0 26px rgba(16, 185, 129, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .status-banner.success {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.24), rgba(16, 185, 129, 0.12));
      border-color: rgba(52, 211, 153, 0.75);
      color: #A7F3D0;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.22);
    }

    .status-banner.error {
      background: rgba(225, 29, 72, 0.2);
      border-color: rgba(244, 63, 94, 0.65);
      color: #FDA4AF;
      box-shadow: 0 0 22px rgba(225, 29, 72, 0.2);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .list.list-fade-out {
      opacity: 0;
      transform: translateY(-4px);
    }

    @keyframes cardFloatIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .card.card-enter {
      animation: cardFloatIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .card:active { transform: scale(0.985); }

    .card.selected {
      background: linear-gradient(135deg, rgba(155, 13, 20, 0.42), rgba(225, 29, 72, 0.22));
      border-color: #FB7185;
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 225, 0.35),
        0 0 24px rgba(225, 29, 72, 0.32);
    }

    .card-left { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .num {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px;
      color: #FCE7E4;
      flex-shrink: 0;
      transition: all 0.22s ease;
    }

    .card.selected .num {
      background: linear-gradient(135deg, #D91E2A, #9B0D14);
      border-color: var(--sdu-gold);
      color: #FFF8F0;
      box-shadow: 0 0 16px rgba(225, 29, 72, 0.55);
    }

    .name { font-size: 16px; font-weight: 700; color: #FFFFFF; }

    .check {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.32);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
      transition: all 0.22s ease;
    }

    .card.selected .check {
      background: linear-gradient(135deg, #FCE3A6, #D4A145);
      border-color: #FFF5D6;
      color: #2A0A0D;
      box-shadow: 0 0 14px rgba(230, 194, 122, 0.6);
    }

    /* 赛前待机页面 */
    #standbyView {
      display: none;
      min-height: calc(100vh - 140px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .standby-card {
      padding: 36px 26px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(155, 13, 20, 0.16));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 20px 50px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .standby-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .standby-lockup img {
      height: 34px;
      width: auto;
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.14));
    }

    .standby-sep {
      font-size: 20px;
      font-weight: 300;
      color: rgba(230, 194, 122, 0.7);
    }

    .standby-college {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #FFF6F4;
    }

    .standby-sub {
      font-size: 13px;
      color: rgba(243, 228, 225, 0.65);
      letter-spacing: 1px;
    }

    .page-footer {
      margin-top: 28px;
      padding: 18px 12px 10px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .page-footer img {
      height: 30px;
      width: auto;
      opacity: 0.88;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    .page-footer span {
      font-size: 11.5px;
      letter-spacing: 1.5px;
      color: rgba(255, 240, 236, 0.5);
    }

    .tech-support {
      font-size: 11px;
      color: rgba(255, 240, 236, 0.38);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .tech-support img {
      height: 15px;
      width: auto;
      opacity: 0.78;
    }

    /* 5 秒纯 CSS 黑底开屏动画 */
    #introSplash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.38s ease;
    }

    #introSplash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-stage {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-text {
      position: absolute;
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.92);
      opacity: 0;
      animation: splashTextSeq 2.5s ease both;
    }

    .splash-logo {
      position: absolute;
      width: 210px;
      max-width: 62vw;
      height: auto;
      opacity: 0;
      animation: splashLogoSeq 1.5s ease 2.55s both;
    }

    @keyframes splashTextSeq {
      0% { opacity: 0; transform: translateY(10px); }
      32% { opacity: 1; transform: translateY(0); }
      72% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes splashLogoSeq {
      0% { opacity: 0; transform: scale(0.92); }
      30% { opacity: 1; transform: scale(1); }
      74% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.03); }
    }

    .skip-btn {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      z-index: 10000;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* 磨砂玻璃弹窗 */
    #popupModal {
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: rgba(6, 2, 4, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #popupModal.show { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(135deg, rgba(38, 12, 18, 0.92), rgba(18, 6, 9, 0.95));
      border: 1px solid rgba(230, 194, 122, 0.35);
      border-radius: 22px;
      padding: 26px 22px 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
      animation: modalPop 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.93) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-body {
      font-size: 15.5px;
      line-height: 1.65;
      color: #FFF4F2;
      white-space: pre-line;
      margin-bottom: 22px;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(180deg, rgba(138, 16, 24, 0.88) 0%, rgba(102, 10, 16, 0.94) 100%);
      color: #F8EDEC;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: rgba(14, 6, 8, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn {
      max-width: 560px;
      margin: 0 auto;
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(138, 16, 24, 0.88) 0%, rgba(102, 10, 16, 0.94) 100%);
      color: #F8EDEC;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: opacity 0.2s, transform 0.15s;
    }

    .song {
      font-size: 13px;
      color: rgba(230, 194, 122, 0.88);
      margin-top: 3px;
    }

    .btn:active:not(:disabled) { transform: scale(0.99); }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 240, 236, 0.4);
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="introSplash">
    <div class="splash-stage">
      <div class="splash-text">Designed by</div>
      <img class="splash-logo" src="/assets/dx-mark.png" alt="D.X." />
    </div>
    <button id="skipSplashBtn" class="skip-btn" type="button">跳过</button>
  </div>

  <div id="popupModal">
    <div class="modal-card">
      <div id="popupBody" class="modal-body"></div>
      <button id="popupConfirmBtn" class="modal-btn" type="button">好</button>
    </div>
  </div>

  <div class="stage-bg"></div>
  <div class="stage-grid"></div>

  <div class="container">
    <div id="standbyView">
      <div class="standby-card">
        <div class="standby-lockup">
          <img src="/assets/sdu-logo-light.png" alt="Shandong University" />
          <span class="standby-sep">｜</span>
          <span class="standby-college">软件学院</span>
        </div>
        <div class="standby-sub">比赛即将开始 · 敬请期待</div>
      </div>
    </div>

    <div id="votingView">
      <div class="header">
        <div class="eyebrow">SCHOOL OF SOFTWARE · TOP 10 SINGERS</div>
        <h1 id="title">十佳歌手大赛 · 实时投票</h1>
        <div class="badge" id="roundBadge">第 1 轮 · 加载中...</div>
      </div>

      <div id="banner" class="status-banner" style="display:none;"></div>
      <div id="list" class="list"></div>
    </div>

    <div class="page-footer">
      <img src="/assets/sdu-logo-light.png" alt="Shandong University" />
      <span>山东大学软件学院 · 十佳歌手大赛</span>
      <div class="tech-support">
        <span>技术支持：</span>
        <img src="/assets/dx-logo.png" alt="D.X. Studio" />
      </div>
    </div>
  </div>

  <div id="bottomDock" class="footer">
    <button id="submitBtn" class="btn" disabled>请先选择选手</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get('code') || '').trim().toUpperCase();

    let appState = null;
    let ticketInfo = null;
    let selectedIds = new Set();
    let splashFinished = false;
    let welcomeChecked = false;

    const titleEl = document.getElementById('title');
    const roundBadgeEl = document.getElementById('roundBadge');
    const bannerEl = document.getElementById('banner');
    const listEl = document.getElementById('list');
    const submitBtn = document.getElementById('submitBtn');
    const standbyViewEl = document.getElementById('standbyView');
    const votingViewEl = document.getElementById('votingView');
    const bottomDockEl = document.getElementById('bottomDock');
    const popupModalEl = document.getElementById('popupModal');
    const popupBodyEl = document.getElementById('popupBody');

    function openPopup(text, onConfirm) {
      if (!text) return;
      popupBodyEl.textContent = text;
      popupModalEl.classList.add('show');
      document.getElementById('popupConfirmBtn').onclick = () => {
        popupModalEl.classList.remove('show');
        if (onConfirm) onConfirm();
      };
    }

    function maybeShowWelcomePopup() {
      if (!splashFinished || welcomeChecked || !appState) return;
      welcomeChecked = true;
      const msg = (appState.settings.welcomePopupText || '').trim();
      const welcomeKey = 'dx_welcome_seen_' + encodeURIComponent(msg).slice(0, 40) + '_' + msg.length;
      if (msg && !localStorage.getItem(welcomeKey)) {
        openPopup(msg, () => localStorage.setItem(welcomeKey, '1'));
      }
    }

    function showBanner(msg, type = '') {
      bannerEl.textContent = msg;
      bannerEl.className = `status-banner ${type}`;
      bannerEl.style.display = 'block';
    }

    async function init() {
      if (!code) {
        try {
          const stateRes = await fetch('/api/state');
          appState = await stateRes.json();
          render();
          maybeShowWelcomePopup();
        } catch (e) {}
        if (!appState?.settings?.standbyMode) {
          showBanner('请扫描门票上的专属二维码进入投票页面', 'error');
        }
        return;
      }
      try {
        const [stateRes, ticketRes] = await Promise.all([
          fetch('/api/state'),
          fetch(`/api/ticket/${encodeURIComponent(code)}`)
        ]);
        appState = await stateRes.json();
        if (!ticketRes.ok) {
          const err = await ticketRes.json();
          render();
          showBanner(err.error || '无效的门票二维码', 'error');
          maybeShowWelcomePopup();
          return;
        }
        ticketInfo = await ticketRes.json();
        render();
        maybeShowWelcomePopup();
      } catch (e) {
        showBanner('网络异常，请刷新重试', 'error');
      }
    }

    function render() {
      if (!appState) return;
      const { settings, leaderboard } = appState;

      if (settings.standbyMode) {
        standbyViewEl.style.display = 'flex';
        votingViewEl.style.display = 'none';
        bottomDockEl.style.display = 'none';
        return;
      }

      standbyViewEl.style.display = 'none';
      votingViewEl.style.display = 'block';
      bottomDockEl.style.display = 'block';

      titleEl.textContent = settings.title;
      const groupPrefix = settings.mode === 'top10' && Number(settings.currentRound) === 1 && Number(settings.activeGroup) > 0
        ? `第 ${settings.activeGroup} 组双人舞台 · `
        : '';
      roundBadgeEl.textContent = `第 ${settings.currentRound} 轮 · ${groupPrefix}每人限投 ${settings.maxVotesPerTicket} 票${code ? ` · 票码 ${code}` : ''}`;

      if (!ticketInfo) {
        if (!code) showBanner('请扫描门票上的专属二维码进入投票页面', 'error');
      } else if (ticketInfo.hasVoted) {
        const votedNames = leaderboard
          .filter(c => ticketInfo.votedIds.includes(c.id))
          .map(c => `${c.number}号 ${c.name || '待定'}`)
          .join('、');
        showBanner(`✅ 您在本组/本轮已投票（已投给：${votedNames}）`, 'success');
        selectedIds = new Set(ticketInfo.votedIds);
      } else if (settings.votingStatus === 'open') {
        showBanner('🟢 投票通道已开启，请选择您支持的选手', 'open');
      } else if (settings.votingStatus === 'paused') {
        showBanner('🟡 投票尚未开启或已暂停，请等待主持人指令');
      } else {
        showBanner('🔴 本轮投票已结束', 'error');
      }

      const nextListSig = `${settings.currentRound}|${settings.activeGroup}|${leaderboard.map(c => c.id).join(',')}`;
      const listChanged = nextListSig !== lastListSignature;
      const hadPrevList = lastListSignature !== '';
      lastListSignature = nextListSig;

      if (listChanged && hadPrevList) {
        if (listSwitchTimer) clearTimeout(listSwitchTimer);
        listEl.classList.add('list-fade-out');
        listSwitchTimer = setTimeout(() => {
          listSwitchTimer = null;
          listEl.classList.remove('list-fade-out');
          renderCards(appState.leaderboard, true);
        }, 180);
      } else if (!listSwitchTimer) {
        renderCards(leaderboard, listChanged);
      }

      updateBtn();
    }

    let lastListSignature = '';
    let listSwitchTimer = null;

    function renderCards(leaderboard, animate) {
      listEl.innerHTML = leaderboard.map((c, idx) => {
        const isSelected = selectedIds.has(c.id);
        const songText = c.song ? `《${c.song}》` : '';
        const animStyle = animate ? `style="animation-delay:${idx * 45}ms"` : '';
        return `
          <div class="card ${isSelected ? 'selected' : ''} ${animate ? 'card-enter' : ''}" ${animStyle} onclick="toggle(${c.id})">
            <div class="card-left">
              <div class="num">${c.number}</div>
              <div>
                <div class="name">${c.number}号 ${c.name || '待填写选手'}</div>
                ${songText ? `<div class="song">${songText}</div>` : ''}
              </div>
            </div>
            <div class="check">${isSelected ? '✓' : ''}</div>
          </div>
        `;
      }).join('');
    }

    window.toggle = function(id) {
      if (!ticketInfo || ticketInfo.hasVoted || appState.settings.votingStatus !== 'open') return;
      const max = Number(appState.settings.maxVotesPerTicket) || 1;
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        if (max === 1) selectedIds.clear();
        if (selectedIds.size >= max) {
          alert(`每轮最多只能投 ${max} 票`);
          return;
        }
        selectedIds.add(id);
      }
      render();
    };

    function updateBtn() {
      if (!ticketInfo) {
        submitBtn.disabled = true;
        submitBtn.textContent = '请扫门票二维码';
        return;
      }
      if (ticketInfo.hasVoted) {
        submitBtn.disabled = true;
        submitBtn.textContent = '本轮已完成投票';
        return;
      }
      if (appState.settings.votingStatus !== 'open') {
        submitBtn.disabled = true;
        submitBtn.textContent = '当前未开放投票';
        return;
      }
      submitBtn.disabled = selectedIds.size === 0;
      submitBtn.textContent = selectedIds.size > 0
        ? `确认投票（已选 ${selectedIds.size} 人）`
        : '请选择选手';
    }

    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';
      try {
        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, contestantIds: Array.from(selectedIds) })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || '提交失败');
          await init();
          return;
        }
        ticketInfo.hasVoted = true;
        ticketInfo.votedIds = data.votedIds;
        render();
      } catch (e) {
        alert('网络错误，请重试');
        updateBtn();
      }
    };

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'POPUP_BROADCAST' && msg.data?.message) {
          openPopup(msg.data.message);
          return;
        }
        if (msg.type === 'STATE_UPDATE') {
          if (!appState) {
            appState = msg.data;
            render();
            maybeShowWelcomePopup();
            return;
          }
          const roundChanged = msg.data.settings.currentRound !== appState.settings.currentRound;
          const groupChanged = msg.data.settings.activeGroup !== appState.settings.activeGroup;
          appState = msg.data;
          if ((roundChanged || groupChanged) && code) {
            const ticketRes = await fetch(`/api/ticket/${encodeURIComponent(code)}`);
            if (ticketRes.ok) {
              ticketInfo = await ticketRes.json();
              if (!ticketInfo.hasVoted) selectedIds.clear();
            }
          }
          render();
          maybeShowWelcomePopup();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    // 4 秒纯 CSS 黑底开屏动画逻辑（Designed by 2.5s + D.X. 1.5s）
    (function setupSplash() {
      const splash = document.getElementById('introSplash');
      const skipBtn = document.getElementById('skipSplashBtn');
      if (!splash) {
        splashFinished = true;
        return;
      }

      let dismissed = false;
      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        splash.classList.add('hide');
        setTimeout(() => {
          splash.remove();
          splashFinished = true;
          maybeShowWelcomePopup();
        }, 380);
      }

      skipBtn.addEventListener('click', dismissSplash);
      setTimeout(dismissSplash, 4050);
    })();

    init();
    connectWS();
  </script>
</body>
</html>
