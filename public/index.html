<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>十佳歌手大赛 · 观众投票</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a103c 0%, #2d1b69 100%);
      color: #fff;
      min-height: 100vh;
      padding: 16px 16px 90px;
    }
    .header { text-align: center; margin-bottom: 18px; }
    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 13px;
      color: #e2d9ff;
    }
    .status-banner {
      background: rgba(255, 193, 7, 0.22);
      border: 2px solid rgba(255, 193, 7, 0.65);
      color: #ffe082;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }
    .status-banner.open {
      background: rgba(16, 185, 129, 0.22);
      border-color: #10b981;
      color: #6ee7b7;
    }
    .status-banner.success {
      background: rgba(16, 185, 129, 0.25);
      border-color: #34d399;
      color: #a7f3d0;
    }
    .status-banner.error {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: rgba(255,255,255,0.08);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card.selected {
      background: rgba(139, 92, 246, 0.28);
      border-color: #a78bfa;
    }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .num {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .card.selected .num { background: #8b5cf6; }
    .name { font-size: 16px; font-weight: 600; }
    .song { font-size: 13px; color: #cbd5e1; margin-top: 2px; }
    .check {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .card.selected .check {
      background: #8b5cf6;
      border-color: #8b5cf6;
    }
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(20, 12, 48, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="title">十佳歌手大赛 · 实时投票</h1>
    <div class="badge" id="roundBadge">第 1 轮 · 加载中...</div>
  </div>

  <div id="banner" class="status-banner" style="display:none;"></div>
  <div id="list" class="list"></div>

  <div class="footer">
    <button id="submitBtn" class="btn" disabled>请先选择选手</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get('code') || '').trim().toUpperCase();

    let appState = null;
    let ticketInfo = null;
    let selectedIds = new Set();

    const titleEl = document.getElementById('title');
    const roundBadgeEl = document.getElementById('roundBadge');
    const bannerEl = document.getElementById('banner');
    const listEl = document.getElementById('list');
    const submitBtn = document.getElementById('submitBtn');

    function showBanner(msg, type = '') {
      bannerEl.textContent = msg;
      bannerEl.className = `status-banner ${type}`;
      bannerEl.style.display = 'block';
    }

    async function init() {
      if (!code) {
        showBanner('请扫描门票上的专属二维码进入投票页面', 'error');
        return;
      }
      try {
        const [stateRes, ticketRes] = await Promise.all([
          fetch('/api/state'),
          fetch(`/api/ticket/${encodeURIComponent(code)}`)
        ]);
        appState = await stateRes.json();
        if (!ticketRes.ok) {
          const err = await ticketRes.json();
          showBanner(err.error || '无效的门票二维码', 'error');
          return;
        }
        ticketInfo = await ticketRes.json();
        render();
      } catch (e) {
        showBanner('网络异常，请刷新重试', 'error');
      }
    }

    function render() {
      const { settings, leaderboard } = appState;
      titleEl.textContent = settings.title;
      roundBadgeEl.textContent = `第 ${settings.currentRound} 轮 · 每人限投 ${settings.maxVotesPerTicket} 票 · 票码 ${code}`;

      if (ticketInfo.hasVoted) {
        const votedNames = leaderboard
          .filter(c => ticketInfo.votedIds.includes(c.id))
          .map(c => `${c.number}号 ${c.name}`)
          .join('、');
        showBanner(`✅ 您在本轮已投票（已投给：${votedNames}）`, 'success');
        selectedIds = new Set(ticketInfo.votedIds);
      } else if (settings.votingStatus === 'open') {
        showBanner('🟢 投票通道已开启，请选择您支持的选手', 'open');
      } else if (settings.votingStatus === 'paused') {
        showBanner('🟡 投票尚未开启或已暂停，请等待主持人指令');
      } else {
        showBanner('🔴 本轮投票已结束', 'error');
      }

      listEl.innerHTML = leaderboard.map(c => {
        const isSelected = selectedIds.has(c.id);
        return `
          <div class="card ${isSelected ? 'selected' : ''}" onclick="toggle(${c.id})">
            <div class="card-left">
              <div class="num">${c.number}</div>
              <div>
                <div class="name">${c.name}</div>
                <div class="song">${c.song || ''}</div>
              </div>
            </div>
            <div class="check">${isSelected ? '✓' : ''}</div>
          </div>
        `;
      }).join('');

      updateBtn();
    }

    window.toggle = function(id) {
      if (!ticketInfo || ticketInfo.hasVoted || appState.settings.votingStatus !== 'open') return;
      const max = Number(appState.settings.maxVotesPerTicket) || 1;
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        if (max === 1) selectedIds.clear();
        if (selectedIds.size >= max) {
          alert(`每轮最多只能投 ${max} 票`);
          return;
        }
        selectedIds.add(id);
      }
      render();
    };

    function updateBtn() {
      if (!ticketInfo) {
        submitBtn.disabled = true;
        submitBtn.textContent = '无效门票';
        return;
      }
      if (ticketInfo.hasVoted) {
        submitBtn.disabled = true;
        submitBtn.textContent = '本轮已完成投票';
        return;
      }
      if (appState.settings.votingStatus !== 'open') {
        submitBtn.disabled = true;
        submitBtn.textContent = '当前未开放投票';
        return;
      }
      submitBtn.disabled = selectedIds.size === 0;
      submitBtn.textContent = selectedIds.size > 0
        ? `确认投票（已选 ${selectedIds.size} 人）`
        : '请选择选手';
    }

    submitBtn.onclick = async () => {
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';
      try {
        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, contestantIds: Array.from(selectedIds) })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || '提交失败');
          await init();
          return;
        }
        ticketInfo.hasVoted = true;
        ticketInfo.votedIds = data.votedIds;
        render();
      } catch (e) {
        alert('网络错误，请重试');
        updateBtn();
      }
    };

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);
      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'STATE_UPDATE' && appState) {
          const roundChanged = msg.data.settings.currentRound !== appState.settings.currentRound;
          appState = msg.data;
          if (roundChanged && code) {
            const ticketRes = await fetch(`/api/ticket/${encodeURIComponent(code)}`);
            if (ticketRes.ok) {
              ticketInfo = await ticketRes.json();
              if (!ticketInfo.hasVoted) selectedIds.clear();
            }
          }
          render();
        }
      };
      ws.onclose = () => setTimeout(connectWS, 2000);
    }

    init();
    connectWS();
  </script>
</body>
</html>
